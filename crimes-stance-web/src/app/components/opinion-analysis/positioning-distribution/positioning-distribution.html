<div class="distribution-card h-full">
  <div class="card-title">
    <i class="bi bi-bar-chart-fill"></i>
    <span>Distribuição de Posicionamentos</span>
  </div>

  <div class="space-y-6">
    <!-- Aprovação -->
    <div class="sentiment-row">
      <div class="sentiment-info">
        <div class="sentiment-label-group">
          <div class="sentiment-icon-box positive-bg">
            <i class="bi bi-emoji-smile-fill positive"></i>
          </div>
          <div>
            <span class="label-text">Aprovação</span>
            <span class="count-text">{{ formatNumber(counts['1'] || 0) }} comentários</span>
          </div>
        </div>
        <div class="percentage-badge positive">{{ percentages.positive }}%</div>
      </div>
      <div class="progress-container">
        <div class="progress-bar positive-bar" [style.width.%]="percentages.positive"></div>
      </div>
    </div>

    <!-- Neutro -->
    <div class="sentiment-row">
      <div class="sentiment-info">
        <div class="sentiment-label-group">
          <div class="sentiment-icon-box neutral-bg">
            <i class="bi bi-emoji-neutral-fill neutral"></i>
          </div>
          <div>
            <span class="label-text">Neutro</span>
            <span class="count-text">{{ formatNumber(counts['0'] || 0) }} comentários</span>
          </div>
        </div>
        <div class="percentage-badge neutral">{{ percentages.neutral }}%</div>
      </div>
      <div class="progress-container">
        <div class="progress-bar neutral-bar" [style.width.%]="percentages.neutral"></div>
      </div>
    </div>

    <!-- Desaprovação -->
    <div class="sentiment-row">
      <div class="sentiment-info">
        <div class="sentiment-label-group">
          <div class="sentiment-icon-box negative-bg">
            <i class="bi bi-emoji-frown-fill negative"></i>
          </div>
          <div>
            <span class="label-text">Desaprovação</span>
            <span class="count-text">{{ formatNumber(counts['-1'] || 0) }} comentários</span>
          </div>
        </div>
        <div class="percentage-badge negative">{{ percentages.negative }}%</div>
      </div>
      <div class="progress-container">
        <div class="progress-bar negative-bar" [style.width.%]="percentages.negative"></div>
      </div>
    </div>
  </div>
</div>
