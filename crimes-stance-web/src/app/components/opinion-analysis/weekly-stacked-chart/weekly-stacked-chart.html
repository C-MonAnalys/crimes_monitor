<div class="bg-white !mx-[-1.5rem] md:!mx-0 !rounded-none md:!rounded-[2rem] shadow-none md:shadow-xl border-y border-x-0 md:border border-slate-100 overflow-hidden transition-all hover:shadow-2xl flex flex-col h-full">
  <!-- Cabeçalho com Título e Filtros -->
  <div class="p-4 sm:p-6 lg:p-8 flex flex-col gap-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <h2 class="text-xl sm:text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3">
        <span class="w-2 h-8 bg-blue-600 rounded-full"></span>
        Volume Semanal por Classe
      </h2>
      
      <!-- Controle de Zoom Premium (Desktop) -->
      <div class="hidden md:flex items-center gap-3">
        <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Zoom</span>
        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl p-1 shadow-inner gap-1">
          <button (click)="zoomOut()" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:bg-white hover:text-blue-600 hover:shadow-sm active:scale-90 transition-all font-bold">
            <i class="bi bi-dash-lg"></i>
          </button>
          <div class="w-px h-4 bg-slate-200/50"></div>
          <button (click)="zoomIn()" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:bg-white hover:text-blue-600 hover:shadow-sm active:scale-90 transition-all font-bold">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Barra de Filtros Responsiva -->
    <div class="bg-slate-50/50 rounded-2xl p-3 sm:p-4 border border-slate-100/50 flex flex-col lg:flex-row items-stretch lg:items-center gap-4">
      <!-- Inputs de Data -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 flex-grow lg:flex-initial">
        <div class="relative flex-grow">
          <input type="date" [(ngModel)]="startDate" class="w-full bg-white border-2 border-slate-100 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all appearance-none cursor-pointer">
          <i class="bi bi-calendar3 absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
        </div>
        <div class="text-center text-slate-400 font-black text-[10px] uppercase hidden sm:block px-2">até</div>
        <div class="relative flex-grow">
          <input type="date" [(ngModel)]="endDate" class="w-full bg-white border-2 border-slate-100 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all appearance-none cursor-pointer">
          <i class="bi bi-calendar3 absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="flex items-center gap-2">
        <button (click)="applyFilter()" class="flex-grow lg:flex-initial bg-slate-900 text-white px-6 py-3 rounded-xl text-sm font-black hover:bg-slate-800 transition-all shadow-lg shadow-slate-200 active:scale-95">
          Aplicar Filtro
        </button>
        <button (click)="clearFilter()" class="px-4 py-3 text-sm font-bold text-slate-500 hover:text-slate-800 transition-colors uppercase tracking-wider text-[10px]">
          Limpar
        </button>
      </div>

      <!-- Controle de Zoom (Mobile Only) -->
      <div class="flex md:hidden items-center justify-between pt-4 border-t border-slate-200/50 mt-2">
        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Zoom Gráfico</span>
        <div class="flex items-center bg-white border border-slate-200 rounded-xl p-1 shadow-sm gap-2">
          <button (click)="zoomOut()" class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-600 bg-slate-50 active:bg-white active:scale-90 transition-all">
            <i class="bi bi-dash-lg"></i>
          </button>
          <button (click)="zoomIn()" class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-600 bg-slate-50 active:bg-white active:scale-90 transition-all">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Legenda Fixa -->
    <div class="flex flex-wrap items-center justify-center gap-x-6 gap-y-3 px-4 py-3 bg-slate-50/30 rounded-2xl border border-slate-100/30">
      <div class="flex items-center gap-2.5 group cursor-default">
        <span class="w-3 h-3 rounded-full bg-emerald-500 ring-4 ring-emerald-500/10 group-hover:scale-125 transition-transform"></span>
        <span class="text-[11px] font-black text-slate-600 uppercase tracking-wide">Aprovação</span>
      </div>
      <div class="flex items-center gap-2.5 group cursor-default">
        <span class="w-3 h-3 rounded-full bg-rose-500 ring-4 ring-rose-500/10 group-hover:scale-125 transition-transform"></span>
        <span class="text-[11px] font-black text-slate-600 uppercase tracking-wide">Desaprovação</span>
      </div>
      <div class="flex items-center gap-2.5 group cursor-default">
        <span class="w-3 h-3 rounded-full bg-slate-500 ring-4 ring-slate-500/10 group-hover:scale-125 transition-transform"></span>
        <span class="text-[11px] font-black text-slate-600 uppercase tracking-wide">Neutro</span>
      </div>
    </div>

    <!-- Container do Gráfico -->
    <div class="relative mt-2 overflow-hidden h-[450px] flex flex-col border border-slate-100 rounded-2xl bg-slate-50/20 shadow-inner">
      <div #scrollContainer *ngIf="hasData; else noDataTemplate" class="flex-grow overflow-auto custom-scrollbar p-2 sm:p-4">
        <div [style.width.px]="getChartWidth()" [style.height.px]="chartHeight" class="relative group">
          <p-chart
            type="bar"
            [data]="chartData"
            [options]="chartOptions"
            [plugins]="[hoverBandPlugin]"
            width="100%"
            height="100%">
          </p-chart>
        </div>
      </div>
      
      <ng-template #noDataTemplate>
        <div class="flex-grow flex flex-col items-center justify-center text-slate-400 p-8 space-y-4 h-full">
          <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center border-2 border-slate-100 border-dashed animate-pulse">
            <i class="bi bi-graph-up text-2xl"></i>
          </div>
          <p class="text-sm font-bold uppercase tracking-widest text-slate-300">Nenhum dado encontrado</p>
        </div>
      </ng-template>
    </div>
    <div *ngIf="isModalVisible" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[9999] p-4">
      <div class="bg-white rounded-[2.5rem] shadow-2xl p-8 w-full max-w-5xl h-[90vh] flex flex-col animate-in fade-in zoom-in duration-300">
        <div class="flex-shrink-0 flex justify-between items-start mb-6">
          <div>
            <h3 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Análise Detalhada da Semana</h3>
            <p *ngIf="selectedWeek" class="text-sm font-bold text-slate-500 mt-1 uppercase tracking-widest">{{ selectedWeek.range }}</p>
          </div>
          <button (click)="isModalVisible = false" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-50 text-slate-400 hover:text-rose-500 hover:bg-rose-50 hover:rotate-90 transition-all text-3xl font-light outline-none border border-slate-100">
            &times;
          </button>
        </div>

        <div class="flex-shrink-0 flex flex-col sm:flex-row sm:items-center gap-4 mb-8 bg-slate-50/50 p-5 rounded-3xl border border-slate-100">
          <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] whitespace-nowrap">Métrica de Erro:</label>
          <select [(ngModel)]="selectedMetric" (change)="updateDrillDownChart()" class="flex-grow bg-white border-2 border-slate-100 rounded-2xl px-5 py-3 text-sm font-bold text-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/5 outline-none transition-all cursor-pointer shadow-sm">
            <option value="precision">Precisão por Classe</option>
            <option value="recall">Revocação (Recall) por Classe</option>
            <option value="f1">F1-Score Combinado</option>
          </select>
        </div>

        <!-- Container do Gráfico Expandido -->
        <div class="flex-grow relative bg-white rounded-[2rem] border border-slate-100 p-4 sm:p-8 shadow-inner overflow-hidden">
          <p-chart
            type="bar"
            [data]="drillDownChartData"
            [options]="drillDownChartOptions"
            [plugins]="[errorBarPlugin]"
            height="100%">
          </p-chart>
        </div>
        
        <div class="flex-shrink-0 mt-8 flex justify-end">
          <button (click)="isModalVisible = false" class="bg-slate-900 text-white px-10 py-4 rounded-2xl text-sm font-black hover:bg-slate-800 transition-all active:scale-95 shadow-xl shadow-slate-200 uppercase tracking-widest">
            Fechar Análise
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
